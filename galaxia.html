<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>galaxia</title><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;touch-action:none;background:#05030f;color:#fff;font-family:Verdana,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}button{font:inherit;color:#fff;background:#ffffff18;border:1px solid #ffffff55;border-radius:99px;padding:10px 16px;cursor:pointer;backdrop-filter:blur(6px)}button.on{background:#fff;color:#000}button:focus-visible{outline:3px solid #7df;outline-offset:2px}.hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 8px #000}</style></head><body>
<canvas id="c"></canvas><div class="hud">arrastra para girar · o toca «mano» para usar tu cámara</div>
<div class="ui" id="u"></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,dpr=Math.min(devicePixelRatio,2);
function rz(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}rz();addEventListener('resize',rz);
const N=7000,P=[];const R=Math.random;
const F={
espiral:i=>{const a=i/N*30,r=i/N*1.6+.05,arm=(i%3)*2.094;const t=a+arm;return[Math.cos(t)*r+(R()-.5)*.12,(R()-.5)*.1*(1.2-r/1.6),Math.sin(t)*r+(R()-.5)*.12]},
esfera:i=>{const u=R()*2-1,t=R()*6.283,s=Math.sqrt(1-u*u);return[s*Math.cos(t)*1.2,u*1.2,s*Math.sin(t)*1.2]},
toro:i=>{const u=R()*6.283,v=R()*6.283;return[(1+.4*Math.cos(v))*Math.cos(u),.4*Math.sin(v),(1+.4*Math.cos(v))*Math.sin(u)]},
helice:i=>{const t=i/N*40,k=i%2?0:3.14;return[Math.cos(t+k)*.5,i/N*3-1.5,Math.sin(t+k)*.5]},
corazon:i=>{const t=R()*6.283,r=R();const x=16*Math.pow(Math.sin(t),3),y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);return[x/14*r**.3,y/14*r**.3,(R()-.5)*.4*r]}};
for(let i=0;i<N;i++)P.push({x:R()*2-1,y:R()*2-1,z:R()*2-1,t:[0,0,0]});
function set(n){P.forEach((p,i)=>p.t=F[n](i));document.querySelectorAll('#u button').forEach(b=>b.classList.toggle('on',b.textContent==n))}
Object.keys(F).forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>set(n);document.getElementById('u').append(b)});set('espiral');{const b=document.createElement('button');b.textContent='mano';b.onclick=()=>cam(b);document.getElementById('u').append(b)}
let ry=0,rx=.6,vy=.004,dn=0,lx,ly,zm=1,rl=0,hs={on:0,x:.5,y:.5,n:0,th:0,v:0,c:0,fist:0},vid,oc,ox,lost=0;
function cam(b){if(vid){return}
navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:320,height:240}}).then(st=>{vid=document.createElement('video');vid.playsInline=true;vid.muted=true;vid.srcObject=st;vid.play();vid.style.cssText='position:fixed;top:60px;right:10px;width:96px;border-radius:10px;opacity:.55;transform:scaleX(-1);pointer-events:none';document.body.append(vid);oc=document.createElement('canvas');oc.width=64;oc.height=48;ox=oc.getContext('2d',{willReadFrequently:true});b.classList.add('on');document.querySelector('.hud').textContent='muestra tu mano a la cámara: muévela, acércala, gírala o ciérrala en puño'}).catch(()=>{document.querySelector('.hud').textContent='no pude abrir la cámara: revisa el permiso del navegador'})}
function trk(){if(!vid||vid.readyState<2)return;ox.drawImage(vid,0,0,64,48);const d=ox.getImageData(0,0,64,48).data;let n=0,sx=0,sy=0,sxx=0,syy=0,sxy=0,x0=64,x1=0,y0=48,y1=0;
for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],cb=128-.169*r-.331*g+.5*b,cr=128+.5*r-.419*g-.081*b,y=.299*r+.587*g+.114*b;if(y>55&&cb>77&&cb<127&&cr>135&&cr<173){const p=i/4,x=p%64,yy=(p/64)|0;n++;sx+=x;sy+=yy;sxx+=x*x;syy+=yy*yy;sxy+=x*yy;if(x<x0)x0=x;if(x>x1)x1=x;if(yy<y0)y0=yy;if(yy>y1)y1=yy}}
if(n<60){if(++lost>8)hs.on=0;return}lost=0;const cx=sx/n,cy=sy/n,mxx=sxx/n-cx*cx,myy=syy/n-cy*cy,mxy=sxy/n-cx*cy,nx=1-cx/64,ny=cy/48,k=.3;
hs.v+=(Math.min(1,Math.hypot(nx-hs.x,ny-hs.y)*8)-hs.v)*.2;hs.x+=(nx-hs.x)*k;hs.y+=(ny-hs.y)*k;hs.n+=(n-hs.n)*k;hs.th+=(-.5*Math.atan2(2*mxy,mxx-myy)-hs.th)*k;
const bb=(x1-x0+1)*(y1-y0+1);hs.c+=(n/bb-hs.c)*.25;const f=hs.c>.7?1:hs.c<.58?0:hs.fist;if(f!=hs.fist){hs.fist=f;set(f?'esfera':'espiral')}hs.on=1}
c.addEventListener('pointerdown',e=>{dn=1;lx=e.clientX;ly=e.clientY});addEventListener('pointerup',()=>dn=0);
addEventListener('pointermove',e=>{if(!dn)return;vy=(e.clientX-lx)*.0008;ry+=(e.clientX-lx)*.008;rx+=(e.clientY-ly)*.006;rx=Math.max(-1.5,Math.min(1.5,rx));lx=e.clientX;ly=e.clientY});
c.addEventListener('wheel',e=>{zm=Math.max(.4,Math.min(3,zm-e.deltaY*.001))});
(function f(t){g.globalCompositeOperation='source-over';g.fillStyle='rgba(5,3,15,.35)';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';
trk();if(hs.on){ry+=((hs.x-.5)*-8-ry)*.12;rx+=((hs.y-.5)*3-rx)*.12;zm+=(Math.max(.5,Math.min(2.6,Math.sqrt(hs.n/3072)*3.2))-zm)*.1;rl+=(hs.th-rl)*.15}else if(!dn)ry+=vy;const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),S=Math.min(W,H)*.34*zm,rc=Math.cos(rl),rs=Math.sin(rl);
for(const p of P){p.x+=(p.t[0]-p.x)*.05;p.y+=(p.t[1]-p.y)*.05;p.z+=(p.t[2]-p.z)*.05;
let x=p.x*cy-p.z*sy,z=p.x*sy+p.z*cy,y=p.y*cx-z*sx;z=p.y*sx+z*cx;const k=1/(1+z*.35);
const px=W/2+(x*rc-y*rs)*S*k,py=H/2+(x*rs+y*rc)*S*k,r=Math.hypot(p.x,p.z);g.fillStyle='hsla('+(200+r*70+t*.01+hs.v*160)%360+',90%,'+(55+z*12)+'%,.7)';g.fillRect(px,py,1.6*k+.4,1.6*k+.4)}
requestAnimationFrame(f)})(0)
</script></body></html>
