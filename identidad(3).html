<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identidad - Detector de Objetos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f1115;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 8px 0 4px 0;
    letter-spacing: 1px;
  }
  #status {
    color: #9aa4b2;
    font-size: 0.9rem;
    margin-bottom: 12px;
    min-height: 20px;
  }
  #container {
    position: relative;
    width: 100%;
    max-width: 900px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    background: #000;
  }
  video {
    width: 100%;
    height: auto;
    display: block;
  }
  video.espejo {
    transform: scaleX(-1); /* solo se usa en cámara frontal */
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #444; cursor: not-allowed; }
  #fps {
    color: #4ade80;
    font-size: 0.85rem;
    margin-top: 8px;
  }
  #general {
    margin-top: 10px;
    max-width: 900px;
    width: 100%;
    background: #1a1d24;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.9rem;
    color: #d5deff;
    min-height: 22px;
  }
  #general b { color: #ffcc00; }
  #general .item { margin-right: 14px; }
</style>
</head>
<body>

<h1>🎥 IDENTIDAD — Detector de Objetos en Vivo</h1>
<div id="status">Presiona "Encender cámara" para comenzar.</div>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>
<canvas id="procesado" style="display:none;"></canvas>

<div id="controls">
  <button id="startBtn">📷 Encender cámara</button>
  <button id="switchBtn" style="display:none;">🔄 Cambiar cámara</button>
  <button id="stopBtn" style="display:none;">Apagar</button>
</div>
<div id="fps"></div>
<div id="general">🔎 Reconocimiento ampliado (1000 categorías): esperando cámara…</div>

<!-- TensorFlow.js, COCO-SSD (detección con cajas, 80 clases) y MobileNet (clasificación general, 1000 clases) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.17.0/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

<script>
// Traducción de las clases detectadas (COCO dataset) al español
const traduccion = {
  person: "persona", bicycle: "bicicleta", car: "auto", motorcycle: "moto",
  airplane: "avión", bus: "autobús", train: "tren", truck: "camión",
  boat: "bote", "traffic light": "semáforo", "fire hydrant": "hidrante",
  "stop sign": "señal de alto", "parking meter": "parquímetro", bench: "banca",
  bird: "ave", cat: "gato", dog: "perro", horse: "caballo", sheep: "oveja",
  cow: "vaca", elephant: "elefante", bear: "oso", zebra: "cebra",
  giraffe: "jirafa", backpack: "mochila", umbrella: "paraguas",
  handbag: "bolso", tie: "corbata", suitcase: "maleta", frisbee: "frisbee",
  skis: "esquís", snowboard: "snowboard", "sports ball": "pelota",
  kite: "cometa", "baseball bat": "bate de béisbol",
  "baseball glove": "guante de béisbol", skateboard: "patineta",
  surfboard: "tabla de surf", "tennis racket": "raqueta de tenis",
  bottle: "botella", "wine glass": "copa de vino", cup: "taza",
  fork: "tenedor", knife: "cuchillo", spoon: "cuchara", bowl: "tazón",
  banana: "plátano", apple: "manzana", sandwich: "sándwich",
  orange: "naranja", broccoli: "brócoli", carrot: "zanahoria",
  "hot dog": "hot dog", pizza: "pizza", donut: "dona", cake: "pastel",
  chair: "silla", couch: "sofá", "potted plant": "planta en maceta",
  bed: "cama", "dining table": "mesa", toilet: "inodoro", tv: "televisor",
  laptop: "laptop", mouse: "mouse", remote: "control remoto",
  keyboard: "teclado", "cell phone": "celular", microwave: "microondas",
  oven: "horno", toaster: "tostadora", sink: "fregadero",
  refrigerator: "refrigerador", book: "libro", clock: "reloj",
  vase: "florero", scissors: "tijeras", "teddy bear": "oso de peluche",
  "hair drier": "secadora de pelo", toothbrush: "cepillo de dientes"
};

// Colores fijos para las categorías más comunes (igual que en los ejemplos de referencia)
const coloresFijos = {
  person: "#ff00ff",     // magenta - persona
  chair: "#0080ff",      // azul - silla
  tv: "#ff0000",         // rojo - televisor
  handbag: "#00ff00",    // verde - bolso
  backpack: "#00ff00",
  laptop: "#00d1ff",
  cell_phone: "#00d1ff"
};
// Paleta rotativa para cualquier otra clase distinta
const coloresRotativos = ["#ffcc00", "#a259ff", "#ff8800", "#14ffec", "#ff5588", "#8bff14", "#ff3d00", "#5865f2"];

function colorPara(clase) {
  if (coloresFijos[clase]) return coloresFijos[clase];
  let hash = 0;
  for (let i = 0; i < clase.length; i++) hash = clase.charCodeAt(i) + ((hash << 5) - hash);
  return coloresRotativos[Math.abs(hash) % coloresRotativos.length];
}

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const procCanvas = document.getElementById('procesado');
const procCtx = procCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const stopBtn = document.getElementById('stopBtn');
const fpsEl = document.getElementById('fps');

const generalEl = document.getElementById('general');

let modelo = null;
let modeloGeneral = null;
let stream = null;
let corriendo = false;
let lastTime = performance.now();
let facingMode = "environment"; // "environment" = trasera, "user" = frontal
let contadorFrames = 0;

// Traducciones frecuentes para las categorías de MobileNet (ImageNet, 1000 clases).
// Si una clase no está aquí, se muestra tal cual (en inglés) — imposible traducir 1000 a mano.
const traduccionGeneral = {
  "golden retriever": "perro golden retriever", "tabby cat": "gato atigrado",
  "Egyptian cat": "gato egipcio", "grey fox": "zorro gris", "timber wolf": "lobo",
  "brown bear": "oso pardo", "African elephant": "elefante africano",
  "Indian elephant": "elefante asiático", "zebra": "cebra", "hippopotamus": "hipopótamo",
  "orangutan": "orangután", "chimpanzee": "chimpancé", "gorilla": "gorila",
  "peacock": "pavo real", "flamingo": "flamenco", "toucan": "tucán",
  "parrot": "loro", "hummingbird": "colibrí", "goldfish": "pez dorado",
  "shark": "tiburón", "jellyfish": "medusa", "starfish": "estrella de mar",
  "banana": "plátano", "orange": "naranja", "lemon": "limón",
  "strawberry": "fresa", "pineapple": "piña", "pomegranate": "granada",
  "mushroom": "hongo", "corn": "maíz", "broccoli": "brócoli",
  "cucumber": "pepino", "bell pepper": "pimiento", "acorn": "bellota",
  "pretzel": "pretzel", "bagel": "bagel", "guacamole": "guacamole",
  "espresso": "café espresso", "wine bottle": "botella de vino",
  "beer bottle": "botella de cerveza", "coffee mug": "taza de café",
  "screwdriver": "destornillador", "hammer": "martillo", "wrench": "llave inglesa",
  "chain saw": "motosierra", "shovel": "pala", "axe": "hacha",
  "acoustic guitar": "guitarra acústica", "electric guitar": "guitarra eléctrica",
  "violin": "violín", "grand piano": "piano de cola", "drum": "tambor",
  "trumpet": "trompeta", "accordion": "acordeón", "flute": "flauta",
  "mountain bike": "bicicleta de montaña", "motor scooter": "moto scooter",
  "pickup truck": "camioneta", "police van": "furgón policial",
  "fire engine": "camión de bomberos", "tractor": "tractor",
  "wheelbarrow": "carretilla", "shopping cart": "carrito de compras",
  "umbrella": "paraguas", "backpack": "mochila", "purse": "bolso",
  "sandal": "sandalia", "cowboy boot": "bota vaquera", "sunglasses": "gafas de sol",
  "wristwatch": "reloj de pulsera", "necklace": "collar",
  "candle": "vela", "lampshade": "pantalla de lámpara",
  "sewing machine": "máquina de coser", "washing machine": "lavadora",
  "space heater": "calentador", "electric fan": "ventilador eléctrico",
  "cellular telephone": "celular", "laptop": "laptop", "desktop computer": "computadora de escritorio",
  "digital clock": "reloj digital", "remote control": "control remoto",
  "traffic light": "semáforo", "street sign": "señal de tránsito",
  "park bench": "banca de parque", "picket fence": "cerca de madera",
  "stone wall": "muro de piedra", "barn": "granero", "greenhouse": "invernadero",
  "pot": "olla", "wok": "wok", "frying pan": "sartén", "spatula": "espátula",
  "cleaver": "cuchillo de carnicero", "corkscrew": "sacacorchos"
};

function traducirGeneral(clase) {
  const limpio = clase.split(",")[0].trim(); // mobilenet a veces da varias etiquetas separadas por coma
  return traduccionGeneral[limpio] || limpio;
}

async function cargarModelo() {
  if (modelo && modeloGeneral) return;
  const tareas = [];
  if (!modelo) tareas.push(cocoSsd.load({ base: 'mobilenet_v2' }).then(m => modelo = m));
  if (!modeloGeneral) tareas.push(mobilenet.load({ version: 2, alpha: 1.0 }).then(m => modeloGeneral = m));
  await Promise.all(tareas);
}

async function abrirStream() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // Solo la cámara frontal se ve en espejo (como un selfie)
  if (facingMode === "user") {
    video.classList.add("espejo");
  } else {
    video.classList.remove("espejo");
  }
}

async function iniciarCamara() {
  startBtn.disabled = true;
  statusEl.textContent = "Encendiendo cámara y cargando modelo…";
  try {
    await Promise.all([abrirStream(), cargarModelo()]);
    corriendo = true;
    startBtn.style.display = "none";
    switchBtn.style.display = "inline-block";
    stopBtn.style.display = "inline-block";
    statusEl.textContent = "Detectando objetos en vivo…";
    detectarLoop();
  } catch (err) {
    startBtn.disabled = false;
    statusEl.textContent = "No se pudo iniciar: " + err.message;
  }
}

async function cambiarCamara() {
  facingMode = facingMode === "environment" ? "user" : "environment";
  statusEl.textContent = "Cambiando de cámara…";
  try {
    await abrirStream();
    statusEl.textContent = "Detectando objetos en vivo…";
  } catch (err) {
    statusEl.textContent = "No se pudo cambiar de cámara: " + err.message;
  }
}

function detenerCamara() {
  corriendo = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  startBtn.style.display = "inline-block";
  startBtn.disabled = false;
  switchBtn.style.display = "none";
  stopBtn.style.display = "none";
  statusEl.textContent = 'Cámara apagada. Presiona "Encender cámara" para volver a empezar.';
  fpsEl.textContent = "";
}

async function detectarLoop() {
  if (!corriendo) return;

  if (video.videoWidth > 0) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    procCanvas.width = video.videoWidth;
    procCanvas.height = video.videoHeight;

    // Mejoramos brillo y contraste antes de detectar (ayuda mucho en ambientes oscuros)
    procCtx.filter = "brightness(1.6) contrast(1.25) saturate(1.1)";
    procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);

    const predicciones = await modelo.detect(procCanvas, 20, 0.2); // umbral muy bajo = detecta más fácil
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const esFrontal = facingMode === "user";

    // En cámara frontal dibujamos en espejo para que coincida con el video volteado
    if (esFrontal) {
      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }

    predicciones.forEach(p => {
      const [x, y, w, h] = p.bbox;
      const nombre = traduccion[p.class] || p.class;
      const porcentaje = Math.round(p.score * 100);
      const color = colorPara(p.class);

      ctx.lineWidth = 3;
      ctx.strokeStyle = color;
      ctx.strokeRect(x, y, w, h);

      const etiqueta = `${nombre} ${porcentaje}%`;
      ctx.font = "bold 18px Segoe UI, Arial";
      const medida = ctx.measureText(etiqueta);
      const alturaEtiqueta = 26;
      const yEtiqueta = Math.max(0, y - alturaEtiqueta);

      ctx.fillStyle = color;
      ctx.fillRect(x - 1, yEtiqueta, medida.width + 12, alturaEtiqueta);

      if (esFrontal) {
        // Texto en espejo inverso para que se lea correctamente
        ctx.save();
        ctx.translate(x + medida.width + 12, yEtiqueta);
        ctx.scale(-1, 1);
        ctx.fillStyle = "#000";
        ctx.fillText(etiqueta, 6, alturaEtiqueta - 7);
        ctx.restore();
      } else {
        ctx.fillStyle = "#000";
        ctx.fillText(etiqueta, x + 6, yEtiqueta + alturaEtiqueta - 7);
      }
    });

    if (esFrontal) {
      ctx.restore();
    }

    const ahora = performance.now();
    const fps = (1000 / (ahora - lastTime)).toFixed(1);
    lastTime = ahora;
    fpsEl.textContent = `FPS: ${fps} · Objetos con caja: ${predicciones.length}`;

    // La clasificación general (1000 categorías) es más pesada, así que corre cada 10 cuadros
    contadorFrames++;
    if (contadorFrames % 10 === 0 && modeloGeneral) {
      modeloGeneral.classify(procCanvas, 5).then(resultados => {
        const relevantes = resultados.filter(r => r.probability > 0.08).slice(0, 4);
        if (relevantes.length > 0) {
          generalEl.innerHTML = "🔎 <b>También podría ser:</b> " + relevantes.map(r =>
            `<span class="item">${traducirGeneral(r.className)} (${Math.round(r.probability * 100)}%)</span>`
          ).join("");
        } else {
          generalEl.innerHTML = "🔎 <b>También podría ser:</b> sin coincidencias claras";
        }
      }).catch(() => {});
    }
  }

  requestAnimationFrame(detectarLoop);
}

startBtn.addEventListener('click', iniciarCamara);
switchBtn.addEventListener('click', cambiarCamara);
stopBtn.addEventListener('click', detenerCamara);
</script>

</body>
</html>
