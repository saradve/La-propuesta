<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>/project1/null2</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0d0d0d;color:#a9a9a9;font:11px/1.35 Menlo,Consolas,ui-monospace,monospace}
#app{display:flex;flex-direction:column;height:100%;max-width:1374px;margin:0 auto;background:#1e1e20}
.title{height:24px;flex:none;background:#2a2a2c;display:flex;align-items:center;gap:6px;padding:0 9px;color:#c8c8c8}
.title i{width:10px;height:10px;border-radius:50%;display:block}
.title span{margin-left:8px}
#stage{flex:1;min-height:0;position:relative;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.6);z-index:2;text-align:center;padding:16px}
#start p{margin:0;color:#ddd;font-size:13px;max-width:44ch}
button{font:inherit;color:#ddd;background:#3a3a3d;border:1px solid #555;border-radius:3px;padding:8px 16px;cursor:pointer}
button:hover{background:#4a4a4e}
button:focus-visible{outline:2px solid #f0912a;outline-offset:2px}
.bar{flex:none;height:58px;display:flex;align-items:stretch;background:#242426;border-top:1px solid #000;position:relative;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar:before{content:"";position:absolute;left:0;top:0;height:2px;width:var(--p,0%);background:#3a6fd8}
.info{width:118px;display:grid;grid-template-columns:auto 1fr auto 1fr;gap:1px 6px;align-content:center;padding:0 8px;font-size:9px;color:#8b8b8b;border-right:1px solid #000}
.info b{font-weight:400;color:#c9c9c9}
.tabs{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 6px}
.tabs em{font-style:normal;font-size:9px;padding:1px 6px;background:#333;color:#aaa}
.tabs em.on{background:#f0912a;color:#111}
.time{display:flex;align-items:center;gap:10px;padding:0 12px;flex:1}
.tc{background:#141415;border:1px solid #000;padding:5px 10px;font-size:15px;color:#cfcfcf;min-width:118px;text-align:center}
.fr{background:#000;border:1px solid #222;padding:5px 10px;font-size:15px;color:#e5e5e5;min-width:66px;text-align:right}
.ctl{display:flex;gap:4px}
.ctl u{width:20px;height:18px;background:#38383b;display:block;text-decoration:none;text-align:center;line-height:18px;font-size:9px;color:#bbb}
.ctl u.on{background:#f0912a;color:#111}
.range{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:0 10px;font-size:9px}
@media(max-width:640px){.info,.range{display:none}.time{gap:6px;padding:0 6px}.tc,.fr{font-size:12px;min-width:0}}
</style>
</head>
<body>
<div id="app">
  <div class="title"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>/project1/null2 (1280,720) (1374,773)</span></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <video id="v" playsinline muted style="display:none"></video>
    <div id="start">
      <p>Cámara + seguimiento de cuerpo y manos con esqueleto de vidrio. La cámara se procesa solo en tu navegador.</p>
      <button id="go">Iniciar cámara</button>
      <button id="demo">Ver demo sin cámara</button>
    </div>
  </div>
  <div class="bar" id="bar">
    <div class="info"><span>Start</span><b>1</b><span>End</span><b>600</b><span>RStart</span><b>1</b><span>REnd</span><b>600</b><span>FPS</span><b>60.0</b><span>Tempo</span><b>120.0</b><span>ResetF</span><b>1</b><span>T Sig</span><b>4 4</b></div>
    <div class="tabs"><em class="on">Timecode</em><em>Beats</em></div>
    <div class="time">
      <div class="tc" id="tc">00:00:00:00</div>
      <div class="fr" id="fr">1</div>
      <div class="ctl"><u>|◂</u><u>❚❚</u><u>◂</u><u class="on">▸</u><u>-</u><u>+</u></div>
    </div>
    <div class="range"><span>Range Limit</span><span><em style="font-style:normal;background:#f0912a;color:#111;padding:0 5px">Loop</em> <em style="font-style:normal;background:#333;padding:0 5px">Once</em></span></div>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), vid = $('v');
let W = 1280, H = 720, pose = null, hand = null, HC = [], mode = null, frame = 1, last = 0;

// --- Tamaño del lienzo ---
function fit() {
  const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = Math.round(r.width * d); H = cv.height = Math.round(r.height * d);
}
addEventListener('resize', fit); fit();

// --- Huesos del cuerpo (índices de MediaPipe Pose) ---
const BODY = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
const FINGERS = [[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]];

// --- Rectángulo "cover" del video dentro del lienzo ---
function rect() {
  const vw = vid.videoWidth || 1280, vh = vid.videoHeight || 720, s = Math.max(W / vw, H / vh);
  return { w: vw * s, h: vh * s, x: (W - vw * s) / 2, y: (H - vh * s) / 2 };
}
const P = (l, R) => ({ x: R.x + (1 - l.x) * R.w, y: R.y + l.y * R.h });

// --- Pose sintética para el modo demo ---
function demoData(t) {
  const L = Array.from({ length: 33 }, () => ({ x: .5, y: .3 }));
  const set = (i, x, y) => L[i] = { x, y };
  const sw = Math.sin(t * 1.6), sw2 = Math.sin(t * 1.6 + 1.7);
  set(0, .5 + sw * .01, .27); set(7, .47, .27); set(8, .53, .27);
  set(11, .43, .42); set(12, .57, .42);
  set(13, .36 + sw * .04, .55); set(14, .64 + sw2 * .04, .55);
  set(15, .3 + sw * .1, .38 + sw2 * .1); set(16, .7 + sw2 * .1, .4 + sw * .1);
  set(23, .46, .68); set(24, .54, .68); set(25, .45, .84); set(26, .55, .84);
  set(27, .45, .97); set(28, .55, .97); set(31, .43, .99); set(32, .57, .99);
  const hands = [15, 16].map((wi, k) => {
    const w = L[wi], ang = (k ? -1 : 1) * (1.2 + sw * .4), pts = [];
    for (let f = 0; f < 5; f++) {
      const a = ang + (f - 2) * .28 * (k ? -1 : 1) - Math.PI / 2 * (k ? -1 : 1) * 0;
      for (let j = 0; j < 4; j++) {
        const len = (j + 1) * (f == 0 ? .012 : .016);
        pts[1 + f * 4 + j] = { x: w.x + Math.cos(a - 1.57) * len * 1.0 * (k ? 1 : 1), y: w.y + Math.sin(a - 1.57) * len };
      }
    }
    pts[0] = w; return pts;
  });
  return { body: L, hands };
}

// --- Dibujo de vidrio / cromo ---
function tube(a, b, w, hue) {
  ctx.lineCap = 'round';
  const passes = [[w + 5, 'rgba(8,12,8,.6)'], [w, 'rgba(160,180,160,.5)'], [w * .55, 'rgba(230,242,222,.55)'], [w * .2, 'rgba(255,255,255,.95)']];
  for (const [lw, c] of passes) { ctx.lineWidth = lw; ctx.strokeStyle = c; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  ctx.lineWidth = w * .18; ctx.strokeStyle = `hsla(${hue},70%,70%,.55)`;
  ctx.beginPath(); ctx.moveTo(a.x + w * .3, a.y - w * .3); ctx.lineTo(b.x + w * .3, b.y - w * .3); ctx.stroke();
}
function joint(p, r) {
  const g = ctx.createRadialGradient(p.x - r * .35, p.y - r * .4, r * .1, p.x, p.y, r);
  g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.45, 'rgba(190,210,190,.55)'); g.addColorStop(1, 'rgba(20,30,20,.7)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 7); ctx.fill();
}
const hist = [];
function drawFigure(body, hands, R) {
  const u = R.h * .011, segs = [];
  const bp = i => P(body[i], R);
  for (const [a, b] of BODY) segs.push([bp(a), bp(b), u * 1.5]);
  for (const h of hands) {
    const pts = h.map(l => P(l, R));
    for (const f of FINGERS) for (let i = 0; i < f.length - 1; i++) if (pts[f[i]] && pts[f[i + 1]]) segs.push([pts[f[i]], pts[f[i + 1]], u * (i ? .6 : 1)]);
    if (pts[5] && pts[17]) segs.push([pts[5], pts[17], u * .8]);
  }
  hist.push(segs); if (hist.length > 7) hist.shift();
  // estelas
  hist.slice(0, -1).forEach((s, i) => {
    ctx.globalAlpha = (i + 1) / hist.length * .22;
    for (const [a, b, w] of s) { ctx.lineWidth = w * .5; ctx.strokeStyle = '#dfe9d8'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
  });
  ctx.globalAlpha = 1;
  segs.forEach(([a, b, w], i) => tube(a, b, w, (performance.now() / 20 + i * 24) % 360));
  const seen = new Set(); for (const [a, b] of BODY) [a, b].forEach(i => { if (!seen.has(i)) { seen.add(i); joint(bp(i), u * 1.9); } });
  // cabeza
  const e1 = bp(7), e2 = bp(8), n = bp(0), r = Math.hypot(e1.x - e2.x, e1.y - e2.y) * .95 + u;
  const c = { x: (e1.x + e2.x) / 2, y: n.y - r * .15 };
  ctx.lineWidth = u * 1.4; ctx.strokeStyle = 'rgba(8,12,8,.6)'; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 7); ctx.stroke();
  ctx.lineWidth = u * .9; ctx.strokeStyle = 'rgba(200,220,200,.55)'; ctx.stroke();
  ctx.lineWidth = u * .25; ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(c.x, c.y, r, 3.6, 5.2); ctx.stroke();
}

// --- Barra de tiempo ---
const pad = (n, l = 2) => String(n).padStart(l, '0');
function tick(now) {
  if (now - last >= 1000 / 60) { frame = frame % 600 + 1; last = now; }
  const f = frame - 1;
  $('tc').textContent = `00:00:${pad(Math.floor(f / 60))}:${pad(f % 60)}`;
  $('fr').textContent = frame;
  $('bar').style.setProperty('--p', (frame / 600 * 100) + '%');
}

// --- Bucle principal ---
function loop(now) {
  requestAnimationFrame(loop);
  tick(now);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const R = rect();
  let body = null, hands = [];
  if (mode === 'cam' && vid.readyState >= 2) {
    ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1); ctx.drawImage(vid, W - (R.x + R.w), R.y, R.w, R.h); ctx.restore();
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, 0, W, H);
    try {
      if (pose) { const r = pose.detectForVideo(vid, now); if (r.landmarks[0]) body = r.landmarks[0]; }
      if (hand) { const r = hand.detectForVideo(vid, now); hands = r.landmarks || []; }
    } catch (e) {}
  } else if (mode === 'demo') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#6d7076'); g.addColorStop(.6, '#c9ccd0'); g.addColorStop(1, '#3b3d40');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const d = demoData(now / 1000); body = d.body; hands = d.hands;
  }
  if (body) drawFigure(body, hands, R);
  else if (mode) hist.length = 0;
}
requestAnimationFrame(loop);

// --- Cargar seguimiento (MediaPipe) ---
async function loadTracking() {
  const M = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const fs = await M.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  const base = 'https://storage.googleapis.com/mediapipe-models/';
  const mk = (C, path, opts) => C.createFromOptions(fs, { baseOptions: { modelAssetPath: base + path, delegate: 'GPU' }, runningMode: 'VIDEO', ...opts });
  pose = await mk(M.PoseLandmarker, 'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', { numPoses: 1 });
  hand = await mk(M.HandLandmarker, 'hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', { numHands: 2 });
}

$('demo').onclick = () => { mode = 'demo'; $('start').remove(); };
$('go').onclick = async () => {
  const btn = $('go'); btn.disabled = true; btn.textContent = 'Abriendo cámara…';
  try {
    vid.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' }, audio: false });
    await vid.play(); mode = 'cam'; $('start').remove();
    loadTracking().catch(() => { mode = 'cam'; });
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Iniciar cámara';
    $('start').querySelector('p').textContent = 'No se pudo abrir la cámara. Revisa el permiso del navegador o prueba la demo.';
  }
};
</script>
</body>
</html>
