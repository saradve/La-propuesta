  X.fillStyle='#fff';X.font='bold '+Math.floor(b.h*(sm?.26:.5))+'px sans-serif';X.textAlign='center';X.fillText(b.t,b.x+b.w/2,b.y+b.h*(sm?.6:.68));X.textAlign='left'}
}
function menu(){
 X.fillStyle='rgba(0,0,0,.35)';X.fillRect(0,0,W,H);
 const s=Math.floor(Math.min(W*.8/49,22)),cy=Math.max(20,H*.1);
 title(W/2,cy,s);
 X.save();X.translate(W/2+s*18,cy+s*5.5);X.rotate(-.3);X.fillStyle='#ffe066';X.font='bold '+Math.max(14,s*.9)+'px sans-serif';X.textAlign='center';X.fillText(splash,0,0);X.restore();
 X.textAlign='center';X.fillStyle='#fff';X.font='bold 13px sans-serif';X.fillText('EDICIÓN 2D · VISTA LATERAL',W/2,cy+s*5+28);
 const by=H*.52,hov=mx>W/2-160&&mx<W/2+160&&my>by&&my<by+46;
 X.fillStyle=hov?'#7a8a9a':'#6a6a6a';X.fillRect(W/2-160,by,320,46);X.strokeStyle='#000';X.lineWidth=3;X.strokeRect(W/2-160,by,320,46);X.lineWidth=1;
 X.fillStyle='#fff';X.font='bold 20px sans-serif';X.fillText('Jugar',W/2,by+31);
 X.font='14px sans-serif';X.shadowColor='#000';X.shadowBlur=4;
 (TCH?['◀ ▶ para caminar · ▲ para saltar','Toca el mundo para picar o golpear','Botón PICAR/PONER cambia el modo','Botón E: inventario y fabricación','Toca la barra de abajo para elegir objeto']:['A / D: caminar izquierda y derecha   ·   W / Espacio: saltar (y nadar)   ·   Shift: agacharse   ·   Ctrl: correr',
  'Mantén clic izquierdo: picar bloques o golpear mobs   ·   Clic derecho: colocar, comer, abrir cofres, usar mesa y horno',
  'Rueda o 1-9: elegir objeto   ·   E: inventario y fabricación   ·   Duerme en una cama de noche',
  'Aldeas, mazmorras con cofres, minas, cuevas con lava, agua, biomas, hambre, zombis, esqueletos, creepers y arañas']).forEach((t,i)=>X.fillText(t,W/2,by+84+i*24));
 X.shadowBlur=0;X.textAlign='left';
}
// ---- controles ----
onkeydown=e=>{const k=e.key.toLowerCase();keys[k]=1;
 if(k==' '||k.startsWith('arrow'))e.preventDefault();
 if(k=='e'&&state==1){craft=!craft;cs=0}
 if(k=='escape')craft=0;
 if(k>='1'&&k<='9')sel=Math.min(off()+ +k-1,Math.max(0,items().length-1))};
onkeyup=e=>keys[e.key.toLowerCase()]=0;
C.onmousemove=e=>{mx=e.offsetX;my=e.offsetY};
C.oncontextmenu=e=>e.preventDefault();
C.onmousedown=e=>{
 mx=e.offsetX;my=e.offsetY;
 if(state==0){state=1;msg('¡Golpea un árbol para empezar!');return}
 if(craft){craftClick(mx,my);return}
 mouse[e.button]=1;
 if(e.button==0){const tx=Math.floor((mx+camX)/TS),ty=Math.floor((my+camY)/TS);if(g(tx,ty)==16&&reach(tx,ty))fuse(tx,ty,2.2)}
};
onmouseup=e=>mouse[e.button]=0;
C.onwheel=e=>{if(craft){cs+=e.deltaY>0?40:-40;return}const n=items().length;if(n)sel=(sel+(e.deltaY>0?1:-1)+n)%n};
onblur=()=>{for(const k in keys)keys[k]=0;mouse[0]=mouse[2]=0};
const tid={},tpos=t=>{const r=C.getBoundingClientRect();return[t.clientX-r.left,t.clientY-r.top]};
const tb=()=>{const s=Math.min(60,Math.floor(W/7)),y=H-62-s-16,y2=y-s*.8-10;return[
 {k:'a',x:10,y,w:s,h:s,t:'◀'},{k:'d',x:20+s,y,w:s,h:s,t:'▶'},{k:' ',x:W-s-10,y,w:s,h:s,t:'▲'},
 {k:'m',x:W-2*s-20,y,w:s,h:s,t:tmode?'PONER':'PICAR'},{k:'e',x:W-s-10,y:y2,w:s,h:s*.8,t:'E'},{k:'shift',x:10,y:y2,w:s,h:s*.8,t:'AGACH'}]};
C.addEventListener('touchstart',e=>{e.preventDefault();
 for(const t of e.changedTouches){const[x,y]=tpos(t);mx=x;my=y;
  if(state==0){state=1;msg('¡Golpea un árbol para empezar!');continue}
  if(craft){tid[t.identifier]={c:1,x0:x,y0:y,y,mv:0};continue}
  const b=tb().find(b=>x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h);
  if(b){if(b.k=='m')tmode^=1;else if(b.k=='e'){craft=1;cs=0}else if(b.k=='shift')keys.shift=!keys.shift;else keys[b.k]=1;tid[t.identifier]=(b.k=='m'||b.k=='e'||b.k=='shift')?{}:{k:b.k};continue}
  const sl=SLT(),sx=W/2-9*sl/2;
  if(y>H-66&&x>sx&&x<sx+9*sl){const n=items().length;if(n)sel=Math.min(off()+Math.floor((x-sx)/sl),n-1);continue}
  const m=tmode?2:0;mouse[m]=1;tid[t.identifier]={m};
  if(!m){const tx=Math.floor((x+camX)/TS),ty=Math.floor((y+camY)/TS);if(g(tx,ty)==16&&reach(tx,ty))fuse(tx,ty,2.2)}}
},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();
 for(const t of e.changedTouches){const[x,y]=tpos(t),s=tid[t.identifier];if(!s)continue;
  if(s.c){cs-=y-s.y;s.mv+=Math.abs(y-s.y);s.y=y}else if(s.m!==undefined){mx=x;my=y}}},{passive:false});
const tend=e=>{e.preventDefault();
 for(const t of e.changedTouches){const s=tid[t.identifier];if(!s)continue;
  if(s.c){if(s.mv<10)craftClick(s.x0,s.y0)}else if(s.k)keys[s.k]=0;else if(s.m!==undefined)mouse[s.m]=0;
  delete tid[t.identifier]}};
C.addEventListener('touchend',tend,{passive:false});C.addEventListener('touchcancel',tend,{passive:false});
let last=0;
function loop(t){const dt=Math.min((t-last)/1000||0,.05);last=t;
 if(state==1)upd(dt);else{camX=Math.max(0,Math.min(WW*TS-W,(t/45)%(WW*TS-W)));const h=hs[Math.min(WW-1,Math.floor((camX+W/2)/TS))];camY=Math.max(0,Math.min(WH*TS-H,h*TS-H*.62))}
 draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
