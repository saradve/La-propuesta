<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Flow</title>
<style>
  :root{
    --accent:#3ee6d8;
    --accent-dim: rgba(62,230,216,0.15);
    --bg:#050708;
    --panel: rgba(255,255,255,0.04);
    --text: rgba(255,255,255,0.92);
    --text-dim: rgba(255,255,255,0.45);
    --border: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); overflow:hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color:var(--text);
  }
  #scene{ position:fixed; inset:0; display:block; touch-action:none; }

  #vignette{
    position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
    z-index:5;
  }

  .hud{ position:fixed; z-index:10; }

  #title-block{ top:18px; left:20px; }
  #title-block .brand{
    display:flex; align-items:center; gap:8px;
    font-size:15px; font-weight:600; letter-spacing:0.2px;
  }
  #title-block .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px var(--accent), 0 0 2px var(--accent);
    animation: pulse 1.8s ease-in-out infinite;
  }
  #title-block .sub{
    margin-top:3px; font-size:11px; color:var(--text-dim);
    letter-spacing:0.3px;
  }

  #top-right{ top:18px; right:20px; display:flex; gap:8px; align-items:center; }
  .chip{
    background:var(--panel); border:1px solid var(--border);
    border-radius:20px; padding:7px 13px; font-size:11.5px;
    color:var(--text-dim); cursor:pointer; user-select:none;
    display:flex; align-items:center; gap:6px;
    transition: all .15s ease;
    backdrop-filter: blur(6px);
  }
  .chip:hover{ color:var(--text); border-color: rgba(255,255,255,0.18); background:rgba(255,255,255,0.07); }
  .chip svg{ width:13px; height:13px; }
  .chip.on{ color:#04211f; background:var(--accent); border-color:var(--accent); }

  #hand-preview-wrap{
    position:fixed; top:64px; right:20px; z-index:10;
    width:160px; border-radius:12px; overflow:hidden;
    border:1px solid var(--border);
    background:#000;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
    display:none;
  }
  #hand-preview-wrap.show{ display:block; }
  #hand-preview{ width:100%; height:auto; display:block; }
  #hand-status{
    position:absolute; bottom:0; left:0; right:0;
    font-size:10px; padding:4px 8px;
    background:rgba(0,0,0,0.55); color:var(--text-dim);
    display:flex; align-items:center; gap:5px;
  }
  #hand-status .hs-dot{
    width:6px; height:6px; border-radius:50%; background:#666;
  }
  #hand-status.detected .hs-dot{ background:#3ee66a; box-shadow:0 0 6px #3ee66a; }
  #hand-status.detected{ color:var(--text); }

  #bottom-left{ bottom:18px; left:20px; font-size:11px; color:var(--text-dim); }
  #bottom-left b{ color:var(--text); font-weight:600; }

  #bottom-right{ bottom:18px; right:20px; font-size:11px; color:var(--text-dim);
    display:flex; align-items:center; gap:6px; }
  #bottom-right .live-dot{
    width:6px; height:6px; border-radius:50%; background:#3ee66a;
    box-shadow:0 0 6px #3ee66a; animation: pulse 1.6s ease-in-out infinite;
  }

  #toolbar{
    bottom:18px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; align-items:center;
    background:rgba(10,12,14,0.55);
    border:1px solid var(--border);
    padding:6px; border-radius:14px;
    backdrop-filter: blur(10px);
    max-width: calc(100vw - 40px);
    overflow-x:auto;
    scrollbar-width:none;
  }
  #toolbar::-webkit-scrollbar{ display:none; }
  .shape-btn{
    white-space:nowrap;
    font-size:12px; color:var(--text-dim);
    background:transparent; border:none; border-radius:9px;
    padding:8px 13px; cursor:pointer;
    transition: all .15s ease;
    font-family:inherit;
  }
  .shape-btn:hover{ color:var(--text); background:rgba(255,255,255,0.06); }
  .shape-btn.active{
    color:#04211f; background:var(--accent);
    font-weight:600;
    box-shadow:0 0 16px var(--accent-dim);
  }
  .shape-btn.reset{ color: #ff8a80; }
  .shape-btn.reset:hover{ background: rgba(255,138,128,0.12); color:#ff8a80; }

  #hint{
    bottom:64px; left:50%; transform:translateX(-50%);
    font-size:11px; color:var(--text-dim);
    opacity:0; transition: opacity .6s ease;
    pointer-events:none; letter-spacing:0.2px;
  }
  #hint.show{ opacity:1; }

  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  @media (max-width: 640px){
    #title-block .sub{ display:none; }
    .chip span.label{ display:none; }
    #bottom-left{ display:none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="vignette"></div>

<div class="hud" id="title-block">
  <div class="brand"><span class="dot"></span> Particle Flow</div>
  <div class="sub">WebGL playground &middot; mueve el cursor para interactuar</div>
</div>

<div class="hud" id="top-right">
  <div class="chip" id="btn-hand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M6 14l-1.5-1.5a1.7 1.7 0 0 0-2.4 2.4l4.2 4.2A6 6 0 0 0 10.5 21H14a6 6 0 0 0 6-6v-4"/></svg>
    <span class="label" id="hand-label">Control por mano</span>
  </div>
  <div class="chip" id="btn-fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
    <span class="label">Pantalla completa</span>
  </div>
</div>

<div id="hand-preview-wrap">
  <canvas id="hand-preview" width="160" height="120"></canvas>
  <div id="hand-status"><span class="hs-dot"></span><span id="hand-status-text">Buscando mano...</span></div>
</div>
<video id="webcam" style="display:none" playsinline></video>

<div class="hud" id="bottom-left">
  <b id="particle-count">0</b> partículas
</div>

<div class="hud" id="bottom-right">
  <span id="fps">60</span> FPS <span class="live-dot"></span>
</div>

<div class="hud" id="hint">Mueve el cursor o el dedo cerca de la pantalla</div>

<div class="hud" id="toolbar">
  <button class="shape-btn reset" data-shape="reset">Reset</button>
  <button class="shape-btn active" data-shape="sphere">Esfera</button>
  <button class="shape-btn" data-shape="heart">Corazón</button>
  <button class="shape-btn" data-shape="torus">Anillo</button>
  <button class="shape-btn" data-shape="galaxy">Galaxia</button>
  <button class="shape-btn" data-shape="tornado">Tornado</button>
  <button class="shape-btn" data-shape="helix">Doble Hélice</button>
  <button class="shape-btn" data-shape="cube">Cubo</button>
  <button class="shape-btn" data-shape="butterfly">Mariposa</button>
  <button class="shape-btn" data-shape="wave">Onda</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
(function(){
  "use strict";

  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x050708, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 11);

  const group = new THREE.Group();
  scene.add(group);

  // ---------- particle count (scale with device) ----------
  const COUNT = window.innerWidth < 640 ? 7000 : 14000;
  document.getElementById('particle-count').textContent = COUNT.toLocaleString('es');

  // ---------- soft circular glow sprite ----------
  function makeSpriteTexture(){
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
    g.addColorStop(0.0, 'rgba(255,255,255,1)');
    g.addColorStop(0.25, 'rgba(255,255,255,0.9)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.35)');
    g.addColorStop(1.0, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,size,size);
    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    return tex;
  }

  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(COUNT*3);
  const targets = new Float32Array(COUNT*3);
  const bases = new Float32Array(COUNT*3);   // shape base (no noise) - used to recompute noise offsets from
  const seeds = new Float32Array(COUNT);      // per-particle random seed for organic flow
  const sizes = new Float32Array(COUNT);

  for(let i=0;i<COUNT;i++){
    seeds[i] = Math.random()*1000;
    sizes[i] = 0.05 + Math.random()*0.09;
  }

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  const material = new THREE.PointsMaterial({
    size: 0.11,
    map: makeSpriteTexture(),
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    color: new THREE.Color(0x3ee6d8),
    sizeAttenuation: true,
    opacity: 0.9
  });

  const points = new THREE.Points(geometry, material);
  group.add(points);

  // subtle core (denser bright center) for extra depth on some shapes
  // (kept simple: reuse same points, glow comes from additive blending + density)

  // ---------- shape generators (return Float32Array length COUNT*3, radius ~ 4-5) ----------
  const R = 4.2;

  function setPoint(arr, i, x, y, z){
    arr[i*3] = x; arr[i*3+1] = y; arr[i*3+2] = z;
  }

  function shapeSphere(arr){
    for(let i=0;i<COUNT;i++){
      const u = Math.random(), v = Math.random();
      const theta = 2*Math.PI*u;
      const phi = Math.acos(2*v-1);
      const r = R * (0.85 + Math.random()*0.15);
      const x = r*Math.sin(phi)*Math.cos(theta);
      const y = r*Math.sin(phi)*Math.sin(theta);
      const z = r*Math.cos(phi);
      setPoint(arr, i, x, y, z);
    }
  }

  function shapeHeart(arr){
    for(let i=0;i<COUNT;i++){
      const t = Math.random()*Math.PI*2;
      const scale = 0.16 * R;
      let x = 16*Math.pow(Math.sin(t),3);
      let y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
      const jitter = 0.85 + Math.random()*0.3;
      x *= scale*jitter; y *= scale*jitter;
      const z = (Math.random()-0.5) * R*0.5;
      setPoint(arr, i, x, y+0.3, z);
    }
  }

  function shapeTorus(arr){
    const Rr = R*0.75, r = R*0.28;
    for(let i=0;i<COUNT;i++){
      const u = Math.random()*Math.PI*2;
      const v = Math.random()*Math.PI*2;
      const rr = r*(0.8+Math.random()*0.2);
      const x = (Rr + rr*Math.cos(v))*Math.cos(u);
      const y = (Rr + rr*Math.cos(v))*Math.sin(u);
      const z = rr*Math.sin(v);
      setPoint(arr, i, x, y, z);
    }
  }

  function shapeGalaxy(arr){
    const arms = 3;
    for(let i=0;i<COUNT;i++){
      const arm = i % arms;
      const t = Math.random();
      const angle = t*Math.PI*5 + arm*(2*Math.PI/arms);
      const r = t*R*1.3;
      const spread = (1-t)*0.5+0.15;
      const x = Math.cos(angle)*r + (Math.random()-0.5)*spread;
      const y = Math.sin(angle)*r + (Math.random()-0.5)*spread;
      const z = (Math.random()-0.5)*spread*1.2;
      setPoint(arr, i, x, y, z);
    }
  }

  function shapeTornado(arr){
    for(let i=0;i<COUNT;i++){
      const t = Math.random();
      const y = (t-0.5)*R*2.2;
      const radius = (1-t)*R*0.9 + 0.15;
      const angle = t*Math.PI*14 + Math.random()*0.3;
      const x = Math.cos(angle)*radius;
      const z = Math.sin(angle)*radius;
      setPoint(arr, i, x, y, z);
    }
  }

  function shapeHelix(arr){
    for(let i=0;i<COUNT;i++){
      const strand = i % 2;
      const t = Math.random();
      const y = (t-0.5)*R*2.4;
      const angle = t*Math.PI*10 + strand*Math.PI;
      const radius = R*0.55;
      const x = Math.cos(angle)*radius + (Math.random()-0.5)*0.15;
      const z = Math.sin(angle)*radius + (Math.random()-0.5)*0.15;
      setPoint(arr, i, x, y, z);
    }
  }

  function shapeCube(arr){
    const s = R*0.72;
    for(let i=0;i<COUNT;i++){
      const face = Math.floor(Math.random()*6);
      let x = (Math.random()*2-1)*s;
      let y = (Math.random()*2-1)*s;
      let z = (Math.random()*2-1)*s;
      if(face===0) x = s; else if(face===1) x = -s;
      else if(face===2) y = s; else if(face===3) y = -s;
      else if(face===4) z = s; else z = -s;
      setPoint(arr, i, x, y, z);
    }
  }

  function shapeButterfly(arr){
    const scale = R*0.5;
    for(let i=0;i<COUNT;i++){
      const t = Math.random()*Math.PI*12;
      const r = Math.exp(Math.cos(t)) - 2*Math.cos(4*t) + Math.pow(Math.sin(t/12),5);
      const x = Math.sin(t)*r*scale*0.4;
      const y = Math.cos(t)*r*scale*0.4;
      const z = (Math.random()-0.5)*R*0.4;
      setPoint(arr, i, x, y, z);
    }
  }

  function shapeWave(arr){
    const w = R*2.2, d = R*1.6;
    for(let i=0;i<COUNT;i++){
      const x = (Math.random()-0.5)*w;
      const z = (Math.random()-0.5)*d;
      const y = Math.sin(x*0.9)*0.9 + Math.cos(z*0.9)*0.9;
      setPoint(arr, i, x, y, z);
    }
  }

  const shapeFns = {
    sphere: shapeSphere,
    heart: shapeHeart,
    torus: shapeTorus,
    galaxy: shapeGalaxy,
    tornado: shapeTornado,
    helix: shapeHelix,
    cube: shapeCube,
    butterfly: shapeButterfly,
    wave: shapeWave
  };

  function generateShape(name, arr){
    (shapeFns[name] || shapeSphere)(arr);
  }

  // init: start as a burst random cloud that will animate into sphere
  for(let i=0;i<COUNT;i++){
    const r = R*2.2*Math.random()+2;
    const theta = Math.random()*Math.PI*2, phi = Math.acos(Math.random()*2-1);
    setPoint(positions, i, r*Math.sin(phi)*Math.cos(theta), r*Math.sin(phi)*Math.sin(theta), r*Math.cos(phi));
  }
  generateShape('sphere', targets);
  bases.set(targets);

  // ---------- interaction state ----------
  const mouse = new THREE.Vector2(0,0);       // normalized -1..1
  const mouseWorld = new THREE.Vector3();
  const raycastPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
  const raycaster = new THREE.Raycaster();
  let hasPointer = false;
  let hintTimeout = null;

  function showHint(){
    const el = document.getElementById('hint');
    el.classList.add('show');
    clearTimeout(hintTimeout);
    hintTimeout = setTimeout(()=> el.classList.remove('show'), 3200);
  }
  showHint();

  function updatePointer(clientX, clientY){
    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(clientY / window.innerHeight) * 2 + 1;
    hasPointer = true;
  }

  window.addEventListener('pointermove', (e)=>{ if(!handActive) updatePointer(e.clientX, e.clientY); });
  window.addEventListener('touchmove', (e)=>{
    if(!handActive && e.touches[0]) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, {passive:true});
  window.addEventListener('pointerleave', ()=>{ if(!handActive) hasPointer = false; });

  // ---------- hand tracking (MediaPipe Hands, 100% local, no upload) ----------
  let handActive = false;
  let handTracking = false;
  let mpCamera = null;
  let pinchEngaged = false;
  const videoEl = document.getElementById('webcam');
  const handCanvas = document.getElementById('hand-preview');
  const handCtx = handCanvas.getContext('2d');
  const handPreviewWrap = document.getElementById('hand-preview-wrap');
  const handStatusEl = document.getElementById('hand-status');
  const handStatusText = document.getElementById('hand-status-text');
  const handBtn = document.getElementById('btn-hand');
  const handLabel = document.getElementById('hand-label');

  function palmCenter(lm){
    // average wrist + finger MCP joints for a stable palm point
    const idx = [0,5,9,13,17];
    let x=0,y=0;
    idx.forEach(i=>{ x+=lm[i].x; y+=lm[i].y; });
    return { x:x/idx.length, y:y/idx.length };
  }

  function onHandResults(results){
    if(results.multiHandLandmarks && results.multiHandLandmarks.length > 0){
      const lm = results.multiHandLandmarks[0];
      const c = palmCenter(lm);
      // video is mirrored (CSS scaleX(-1) look) so flip x for intuitive control
      mouse.x = (1 - c.x) * 2 - 1;
      mouse.y = -(c.y * 2 - 1);
      hasPointer = true;

      if(!handStatusEl.classList.contains('detected')){
        handStatusEl.classList.add('detected');
        handStatusText.textContent = 'Mano detectada';
      }

      // pinch gesture (thumb tip 4, index tip 8) triggers a reset burst
      const dx = lm[4].x - lm[8].x, dy = lm[4].y - lm[8].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if(dist < 0.055 && !pinchEngaged){
        pinchEngaged = true;
        triggerReset();
      } else if(dist > 0.09){
        pinchEngaged = false;
      }

      // draw preview + skeleton (mirrored)
      handCtx.save();
      handCtx.clearRect(0,0,handCanvas.width, handCanvas.height);
      handCtx.translate(handCanvas.width, 0);
      handCtx.scale(-1,1);
      handCtx.drawImage(videoEl, 0,0, handCanvas.width, handCanvas.height);
      if(window.drawConnectors && window.HAND_CONNECTIONS){
        drawConnectors(handCtx, lm, HAND_CONNECTIONS, {color:'#3ee6d8', lineWidth:2});
        drawLandmarks(handCtx, lm, {color:'#ffffff', radius:2});
      }
      handCtx.restore();
    } else {
      handStatusEl.classList.remove('detected');
      handStatusText.textContent = 'Buscando mano...';
      hasPointer = false;
    }
  }

  let handsModel = null;

  async function enableHandControl(){
    try{
      handBtn.classList.add('on');
      handLabel.textContent = 'Desactivar mano';
      handPreviewWrap.classList.add('show');

      if(!handsModel){
        handsModel = new Hands({ locateFile: (f)=> `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
        handsModel.setOptions({ maxNumHands:1, modelComplexity:1, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
        handsModel.onResults(onHandResults);
      }

      mpCamera = new Camera(videoEl, {
        onFrame: async ()=>{ await handsModel.send({ image: videoEl }); },
        width: 320, height: 240
      });
      await mpCamera.start();
      handActive = true;
      handTracking = true;
    }catch(err){
      console.error(err);
      handStatusText.textContent = 'No se pudo acceder a la cámara';
      disableHandControl();
    }
  }

  function disableHandControl(){
    handActive = false;
    handTracking = false;
    hasPointer = false;
    handBtn.classList.remove('on');
    handLabel.textContent = 'Control por mano';
    handPreviewWrap.classList.remove('show');
    if(mpCamera){ try{ mpCamera.stop(); }catch(e){} }
  }

  handBtn.addEventListener('click', ()=>{
    if(handActive) disableHandControl();
    else enableHandControl();
  });

  // ---------- toolbar ----------
  const buttons = document.querySelectorAll('.shape-btn');
  let currentShape = 'sphere';
  let morphStart = 0;
  const MORPH_MS = 1400;
  let morphFrom = new Float32Array(positions); // snapshot at morph start

  function setActive(btn){
    buttons.forEach(b=>b.classList.remove('active'));
    if(btn) btn.classList.add('active');
  }

  function triggerReset(){
    for(let i=0;i<COUNT;i++){
      const r = R*3.5*(0.5+Math.random());
      const theta = Math.random()*Math.PI*2, phi = Math.acos(Math.random()*2-1);
      positions[i*3]   = r*Math.sin(phi)*Math.cos(theta);
      positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
      positions[i*3+2] = r*Math.cos(phi);
    }
    morphFrom.set(positions);
    morphStart = performance.now();
  }

  buttons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const shape = btn.dataset.shape;
      if(shape === 'reset'){
        triggerReset();
        return;
      }
      setActive(btn);
      currentShape = shape;
      generateShape(shape, targets);
      morphFrom.set(positions);
      morphStart = performance.now();
    });
  });

  // ---------- fullscreen ----------
  document.getElementById('btn-fullscreen').addEventListener('click', ()=>{
    if(!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    } else {
      document.exitFullscreen().catch(()=>{});
    }
  });

  // ---------- resize ----------
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- animation loop ----------
  const posAttr = geometry.getAttribute('position');
  let lastTime = performance.now();
  let fpsAccum = 0, fpsFrames = 0, fpsLastUpdate = performance.now();
  const tmpVec = new THREE.Vector3();

  function updateMouseWorld(){
    raycaster.setFromCamera(mouse, camera);
    raycaster.ray.intersectPlane(raycastPlane, tmpVec);
    if(tmpVec) mouseWorld.copy(tmpVec);
  }

  function animate(now){
    requestAnimationFrame(animate);
    const dt = Math.min((now - lastTime)/1000, 0.05);
    lastTime = now;

    // fps counter
    fpsFrames++;
    if(now - fpsLastUpdate > 500){
      const fps = Math.round(fpsFrames*1000/(now-fpsLastUpdate));
      document.getElementById('fps').textContent = fps;
      fpsFrames = 0; fpsLastUpdate = now;
    }

    updateMouseWorld();

    const t = Math.min((now - morphStart)/MORPH_MS, 1);
    const ease = t<1 ? 1 - Math.pow(1-t, 3) : 1;

    const time = now * 0.001;

    for(let i=0;i<COUNT;i++){
      const ix = i*3, iy = i*3+1, iz = i*3+2;

      // interpolate toward target shape
      const bx = morphFrom[ix] + (targets[ix]-morphFrom[ix])*ease;
      const by = morphFrom[iy] + (targets[iy]-morphFrom[iy])*ease;
      const bz = morphFrom[iz] + (targets[iz]-morphFrom[iz])*ease;

      // organic flowing noise (cheap sine-based, unique phase per particle)
      const seed = seeds[i];
      const nx = Math.sin(time*0.6 + seed) * 0.06;
      const ny = Math.cos(time*0.5 + seed*1.3) * 0.06;
      const nz = Math.sin(time*0.4 + seed*0.7) * 0.06;

      let px = bx + nx;
      let py = by + ny;
      let pz = bz + nz;

      // mouse repulsion
      if(hasPointer){
        const dx = px - mouseWorld.x;
        const dy = py - mouseWorld.y;
        const dz = pz - mouseWorld.z*0.0; // keep interaction on screen plane mostly
        const distSq = dx*dx + dy*dy;
        const influenceRadius = 2.6;
        if(distSq < influenceRadius*influenceRadius){
          const dist = Math.sqrt(distSq) || 0.001;
          const force = (1 - dist/influenceRadius) * 1.1;
          px += (dx/dist) * force;
          py += (dy/dist) * force;
        }
      }

      positions[ix] = px;
      positions[iy] = py;
      positions[iz] = pz;
    }

    posAttr.needsUpdate = true;

    group.rotation.y += dt * 0.08;
    group.rotation.x += (mouse.y*0.15 - group.rotation.x) * 0.6 * dt;

    camera.position.x += ((mouse.x*0.6) - camera.position.x) * 0.8 * dt;
    camera.position.y += ((mouse.y*0.4) - camera.position.y) * 0.8 * dt;
    camera.lookAt(0,0,0);

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

})();
</script>
