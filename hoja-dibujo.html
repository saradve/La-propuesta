<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hoja de Dibujo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #e9e6df;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px;
  }
  h1 {
    font-size: 18px;
    color: #333;
    margin: 4px 0 10px;
  }
  #toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    background: #fff;
    padding: 10px 14px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    margin-bottom: 12px;
  }
  #toolbar label {
    font-size: 13px;
    color: #555;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  input[type="color"] {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    padding: 0;
    cursor: pointer;
    background: none;
  }
  input[type="range"] {
    width: 100px;
  }
  button {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: #4a5cff;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #3646d8; }
  button.secondary {
    background: #eee;
    color: #333;
  }
  button.secondary:hover { background: #ddd; }
  button.active {
    outline: 2px solid #4a5cff;
  }
  #canvas-wrap {
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.15);
    touch-action: none;
  }
  canvas {
    display: block;
    cursor: crosshair;
    border-radius: 4px;
  }
</style>
</head>
<body>

<h1>🎨 Hoja de Dibujo</h1>

<div id="toolbar">
  <label>Color <input type="color" id="colorPicker" value="#222222"></label>
  <label>Grosor <input type="range" id="sizePicker" min="1" max="50" value="4"></label>
  <button id="penBtn" class="active">✏️ Lápiz</button>
  <button id="eraserBtn" class="secondary">🧽 Borrador</button>
  <button id="clearBtn" class="secondary">🗑️ Limpiar todo</button>
  <button id="downloadBtn" class="secondary">💾 Descargar</button>
</div>

<div id="canvas-wrap">
  <canvas id="canvas" width="900" height="600"></canvas>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Fondo blanco inicial
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let drawing = false;
  let lastX = 0, lastY = 0;
  let mode = 'pen'; // 'pen' o 'eraser'

  const colorPicker = document.getElementById('colorPicker');
  const sizePicker = document.getElementById('sizePicker');
  const penBtn = document.getElementById('penBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    if (e.touches && e.touches.length > 0) {
      return {
        x: (e.touches[0].clientX - rect.left) * scaleX,
        y: (e.touches[0].clientY - rect.top) * scaleY
      };
    }
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function startDraw(e) {
    drawing = true;
    const pos = getPos(e);
    lastX = pos.x;
    lastY = pos.y;
    e.preventDefault();
  }

  function draw(e) {
    if (!drawing) return;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = sizePicker.value;
    ctx.strokeStyle = mode === 'eraser' ? '#ffffff' : colorPicker.value;
    ctx.stroke();
    lastX = pos.x;
    lastY = pos.y;
    e.preventDefault();
  }

  function endDraw() {
    drawing = false;
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('mouseleave', endDraw);

  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', draw, { passive: false });
  canvas.addEventListener('touchend', endDraw);

  penBtn.addEventListener('click', () => {
    mode = 'pen';
    penBtn.classList.add('active');
    eraserBtn.classList.remove('active');
  });

  eraserBtn.addEventListener('click', () => {
    mode = 'eraser';
    eraserBtn.classList.add('active');
    penBtn.classList.remove('active');
  });

  clearBtn.addEventListener('click', () => {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  });

  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'mi-dibujo.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
</script>

</body>
</html>
