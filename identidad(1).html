<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Identidad - Detector de Objetos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0f1115;
    color: #eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 8px 0 4px 0;
    letter-spacing: 1px;
  }
  #status {
    color: #9aa4b2;
    font-size: 0.9rem;
    margin-bottom: 12px;
    min-height: 20px;
  }
  #container {
    position: relative;
    width: 100%;
    max-width: 900px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(0,0,0,0.6);
    background: #000;
  }
  video {
    width: 100%;
    height: auto;
    display: block;
  }
  video.espejo {
    transform: scaleX(-1); /* solo se usa en cámara frontal */
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }
  #controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #444; cursor: not-allowed; }
  #fps {
    color: #4ade80;
    font-size: 0.85rem;
    margin-top: 8px;
  }
</style>
</head>
<body>

<h1>🎥 IDENTIDAD — Detector de Objetos en Vivo</h1>
<div id="status">Cargando modelo de inteligencia artificial…</div>

<div id="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<div id="controls">
  <button id="startBtn" disabled>Iniciar cámara</button>
  <button id="switchBtn" disabled>🔄 Cambiar cámara</button>
  <button id="stopBtn" disabled>Detener</button>
</div>
<div id="fps"></div>

<!-- TensorFlow.js y modelo COCO-SSD (detección de objetos preentrenado) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.17.0/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<script>
// Traducción de las clases detectadas (COCO dataset) al español
const traduccion = {
  person: "persona", bicycle: "bicicleta", car: "auto", motorcycle: "moto",
  airplane: "avión", bus: "autobús", train: "tren", truck: "camión",
  boat: "bote", "traffic light": "semáforo", "fire hydrant": "hidrante",
  "stop sign": "señal de alto", "parking meter": "parquímetro", bench: "banca",
  bird: "ave", cat: "gato", dog: "perro", horse: "caballo", sheep: "oveja",
  cow: "vaca", elephant: "elefante", bear: "oso", zebra: "cebra",
  giraffe: "jirafa", backpack: "mochila", umbrella: "paraguas",
  handbag: "bolso", tie: "corbata", suitcase: "maleta", frisbee: "frisbee",
  skis: "esquís", snowboard: "snowboard", "sports ball": "pelota",
  kite: "cometa", "baseball bat": "bate de béisbol",
  "baseball glove": "guante de béisbol", skateboard: "patineta",
  surfboard: "tabla de surf", "tennis racket": "raqueta de tenis",
  bottle: "botella", "wine glass": "copa de vino", cup: "taza",
  fork: "tenedor", knife: "cuchillo", spoon: "cuchara", bowl: "tazón",
  banana: "plátano", apple: "manzana", sandwich: "sándwich",
  orange: "naranja", broccoli: "brócoli", carrot: "zanahoria",
  "hot dog": "hot dog", pizza: "pizza", donut: "dona", cake: "pastel",
  chair: "silla", couch: "sofá", "potted plant": "planta en maceta",
  bed: "cama", "dining table": "mesa", toilet: "inodoro", tv: "televisor",
  laptop: "laptop", mouse: "mouse", remote: "control remoto",
  keyboard: "teclado", "cell phone": "celular", microwave: "microondas",
  oven: "horno", toaster: "tostadora", sink: "fregadero",
  refrigerator: "refrigerador", book: "libro", clock: "reloj",
  vase: "florero", scissors: "tijeras", "teddy bear": "oso de peluche",
  "hair drier": "secadora de pelo", toothbrush: "cepillo de dientes"
};

// Colores fijos para las categorías más comunes (igual que en los ejemplos de referencia)
const coloresFijos = {
  person: "#ff00ff",     // magenta - persona
  chair: "#0080ff",      // azul - silla
  tv: "#ff0000",         // rojo - televisor
  handbag: "#00ff00",    // verde - bolso
  backpack: "#00ff00",
  laptop: "#00d1ff",
  cell_phone: "#00d1ff"
};
// Paleta rotativa para cualquier otra clase distinta
const coloresRotativos = ["#ffcc00", "#a259ff", "#ff8800", "#14ffec", "#ff5588", "#8bff14", "#ff3d00", "#5865f2"];

function colorPara(clase) {
  if (coloresFijos[clase]) return coloresFijos[clase];
  let hash = 0;
  for (let i = 0; i < clase.length; i++) hash = clase.charCodeAt(i) + ((hash << 5) - hash);
  return coloresRotativos[Math.abs(hash) % coloresRotativos.length];
}

const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const switchBtn = document.getElementById('switchBtn');
const stopBtn = document.getElementById('stopBtn');
const fpsEl = document.getElementById('fps');

let modelo = null;
let stream = null;
let corriendo = false;
let lastTime = performance.now();
let facingMode = "environment"; // "environment" = trasera, "user" = frontal

async function cargarModelo() {
  try {
    modelo = await cocoSsd.load();
    statusEl.textContent = "Modelo cargado. Presiona 'Iniciar cámara'.";
    startBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = "Error al cargar el modelo: " + err.message;
  }
}

async function abrirStream() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: facingMode } },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  // Solo la cámara frontal se ve en espejo (como un selfie)
  if (facingMode === "user") {
    video.classList.add("espejo");
  } else {
    video.classList.remove("espejo");
  }
}

async function iniciarCamara() {
  try {
    await abrirStream();
    corriendo = true;
    startBtn.disabled = true;
    switchBtn.disabled = false;
    stopBtn.disabled = false;
    statusEl.textContent = "Detectando objetos en vivo…";
    detectarLoop();
  } catch (err) {
    statusEl.textContent = "No se pudo acceder a la cámara: " + err.message;
  }
}

async function cambiarCamara() {
  facingMode = facingMode === "environment" ? "user" : "environment";
  statusEl.textContent = "Cambiando de cámara…";
  try {
    await abrirStream();
    statusEl.textContent = "Detectando objetos en vivo…";
  } catch (err) {
    statusEl.textContent = "No se pudo cambiar de cámara: " + err.message;
  }
}

function detenerCamara() {
  corriendo = false;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  startBtn.disabled = false;
  switchBtn.disabled = true;
  stopBtn.disabled = true;
  statusEl.textContent = "Cámara detenida.";
  fpsEl.textContent = "";
}

async function detectarLoop() {
  if (!corriendo) return;

  if (video.videoWidth > 0) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const predicciones = await modelo.detect(video);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const esFrontal = facingMode === "user";

    // En cámara frontal dibujamos en espejo para que coincida con el video volteado
    if (esFrontal) {
      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }

    predicciones.forEach(p => {
      const [x, y, w, h] = p.bbox;
      const nombre = traduccion[p.class] || p.class;
      const porcentaje = Math.round(p.score * 100);
      const color = colorPara(p.class);

      ctx.lineWidth = 3;
      ctx.strokeStyle = color;
      ctx.strokeRect(x, y, w, h);

      const etiqueta = `${nombre} ${porcentaje}%`;
      ctx.font = "bold 18px Segoe UI, Arial";
      const medida = ctx.measureText(etiqueta);
      const alturaEtiqueta = 26;
      const yEtiqueta = Math.max(0, y - alturaEtiqueta);

      ctx.fillStyle = color;
      ctx.fillRect(x - 1, yEtiqueta, medida.width + 12, alturaEtiqueta);

      if (esFrontal) {
        // Texto en espejo inverso para que se lea correctamente
        ctx.save();
        ctx.translate(x + medida.width + 12, yEtiqueta);
        ctx.scale(-1, 1);
        ctx.fillStyle = "#000";
        ctx.fillText(etiqueta, 6, alturaEtiqueta - 7);
        ctx.restore();
      } else {
        ctx.fillStyle = "#000";
        ctx.fillText(etiqueta, x + 6, yEtiqueta + alturaEtiqueta - 7);
      }
    });

    if (esFrontal) {
      ctx.restore();
    }

    const ahora = performance.now();
    const fps = (1000 / (ahora - lastTime)).toFixed(1);
    lastTime = ahora;
    fpsEl.textContent = `FPS: ${fps} · Objetos detectados: ${predicciones.length}`;
  }

  requestAnimationFrame(detectarLoop);
}

startBtn.addEventListener('click', iniciarCamara);
switchBtn.addEventListener('click', cambiarCamara);
stopBtn.addEventListener('click', detenerCamara);

cargarModelo();
</script>

</body>
</html>
